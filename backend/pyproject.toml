[project]
name = "llm-price-calculator-backend"
version = "0.1.0"
description = "Estimate and measure the USD cost of sending a prompt to an LLM API."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.2",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "pydantic-settings>=2.16.2",
    "slowapi>=0.1.10",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

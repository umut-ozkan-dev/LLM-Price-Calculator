services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MAX_OUTPUT_TOKENS_CAP: ${MAX_OUTPUT_TOKENS_CAP:-8192}
      DEFAULT_MAX_OUTPUT_TOKENS: ${DEFAULT_MAX_OUTPUT_TOKENS:-1024}
      RATE_LIMIT_RUN: ${RATE_LIMIT_RUN:-10/minute}
      ESTIMATE_OUTPUT_LOW_RATIO: ${ESTIMATE_OUTPUT_LOW_RATIO:-0.10}
      ESTIMATE_OUTPUT_EXPECTED_RATIO: ${ESTIMATE_OUTPUT_EXPECTED_RATIO:-0.50}
      ESTIMATE_OUTPUT_HIGH_RATIO: ${ESTIMATE_OUTPUT_HIGH_RATIO:-2.0}
      ESTIMATE_OUTPUT_LOW_MIN: ${ESTIMATE_OUTPUT_LOW_MIN:-50}
      ESTIMATE_OUTPUT_EXPECTED_MIN: ${ESTIMATE_OUTPUT_EXPECTED_MIN:-150}
      CHARS_PER_TOKEN: ${CHARS_PER_TOKEN:-4}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
